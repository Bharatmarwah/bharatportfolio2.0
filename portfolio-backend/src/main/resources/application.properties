spring.application.name=portfolio-backend

# Secrets and machine-specific values are loaded from .env at the project root.
# .env is git-ignored; commit .env.example instead. The [.]properties hint tells
# Spring Boot to parse the KEY=VALUE lines as a properties document.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# Browser origins allowed to call /v1/**. Comma-separated; wildcards such as
# https://*.vercel.app are supported. Set CORS_ALLOWED_ORIGINS in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# Shared secret required in the X-Admin-Key header on every /v1 request that is not
# annotated @PublicEndpoint. Unset means fail closed (503), never open.
admin.api-key=${ADMIN_API_KEY:}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portfolio_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Responses are mapped to DTOs inside transactional services, so lazy relations
# never need to be resolved during response rendering.
spring.jpa.open-in-view=false

# The /v1/me aggregate walks several lazy associations (technologies, tags, ...).
# Batch fetching keeps that to a handful of queries instead of one per row.
spring.jpa.properties.hibernate.default_batch_fetch_size=25

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:false}

spring.sql.init.mode=always

# Where contact-form notifications are delivered. This is the owner's inbox and is
# always server-controlled, so a caller can never choose the recipient.
# If blank, contact messages are still archived but no email is sent.
app.mail.notification-to=${MAIL_NOTIFICATION_TO:${MAIL_USERNAME:}}